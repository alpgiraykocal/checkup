<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AML/CFT Uyum Check-up</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231E40AF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>">
</head>
<body>
<a class="skip-link" href="#content">İçeriğe atla</a>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">AML/CFT Uyum Check-up</div>
      <div class="brand-sub">Anket · QA · Aksiyon Planı</div>
    </div>
    <nav id="nav" class="nav" aria-label="Ana gezinme"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-sm btn-block" data-act="export">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
        Dışa aktar
      </button>
      <button class="btn btn-sm btn-block" data-act="import">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
        Çalışma dosyası yükle
      </button>
      <button class="btn btn-sm btn-block btn-danger" data-act="reset">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        Sıfırla
      </button>
      <div class="subtle center" id="saved-at" aria-live="polite">Kayıt yok</div>
      <div class="subtle center">Veriler yalnızca bu tarayıcıda saklanır.</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="flex:1;min-width:200px">
        <h1 id="page-title">Uyum Check-up Panosu</h1>
        <div class="topbar-sub" id="page-sub"></div>
      </div>
      <button class="btn btn-icon only-narrow" data-act="export" aria-label="Veri ve yedekleme">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
      </button>
      <button class="btn btn-icon" id="print-btn" aria-label="Yazdır">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
      <button class="btn btn-icon" id="theme-btn" aria-label="Koyu temaya geç"></button>
    </header>

    <main id="content" class="content" tabindex="-1"></main>
  </div>
</div>

<input type="file" id="file-input" accept="application/json,.json" class="sr-only" aria-hidden="true" tabindex="-1">

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/actions.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
